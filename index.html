<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Asesores - Cartera y Pagos</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --border-color: #ddd;
            --btn-hover: #004494;
            --card-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        
        .container { 
            width: 100%; max-width: 99%; box-sizing: border-box; margin: auto; 
            background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 80vh; 
        }
        
        h2 { margin-top: 0; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-volver { background-color: #6c757d; color: white; border: none; padding: 8px 15px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; display: none; }
        .btn-volver:hover { background-color: #5a6268; }
        #vista-asesores { padding: 20px 0; }
        .mensaje-carga { text-align: center; font-size: 18px; color: #555; font-weight: bold; margin-top: 40px; }
        .grid-asesores { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .tarjeta-asesor { background: linear-gradient(135deg, #ffffff, #fdfdfd); border: 1px solid var(--border-color); border-left: 5px solid var(--primary-color); padding: 25px 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .tarjeta-asesor:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,86,179,0.15); border-color: var(--primary-color); }
        .tarjeta-asesor h3 { margin: 0; font-size: 16px; color: #333; text-transform: uppercase; }
        .icono-usuario { font-size: 40px; margin-bottom: 10px; color: var(--primary-color); }
        #vista-dashboard { display: none; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .dashboard-wrapper { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; margin-top: 15px; align-items: flex-start; }
        .card-recaudo { background: linear-gradient(135deg, #0056b3, #004494); color: white; padding: 20px; border-radius: 8px; min-width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: center; }
        .card-recaudo h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #e0e0e0; padding-bottom: 0; }
        .card-recaudo p { margin: 0; font-size: 28px; font-weight: bold; }
        .filtros-wrapper { display: flex; flex-wrap: wrap; gap: 15px; background: #e9ecef; padding: 15px; border-radius: 6px; align-items: center; border: 1px solid var(--border-color); flex: 1; }
        .filtros-wrapper label { font-weight: bold; font-size: 14px; color: #333; margin-right: -5px; }
        .filtros-wrapper select, .filtros-wrapper input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; min-width: 150px; }
        
        .multi-select { position: relative; min-width: 180px; user-select: none; font-family: sans-serif; }
        .select-box { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; background: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #333; }
        .options-container { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border-color); z-index: 100; max-height: 200px; overflow-y: auto; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 5px; }
        .option-label { display: flex; align-items: center; padding: 6px 12px; cursor: pointer; font-size: 13px; color: #333; border-bottom: 1px solid #eee; margin: 0; }
        .option-label:last-child { border-bottom: none; }
        .option-label:hover { background: #f0f7ff; }
        .option-label input { margin-right: 8px; cursor: pointer; }

        .table-container { overflow-x: auto; max-height: 650px; border: 1px solid var(--border-color); border-radius: 4px; }
        table { border-collapse: collapse; width: 100%; }
        th { background-color: var(--primary-color); color: white; position: sticky; top: 0; z-index: 1; padding: 10px 12px; text-align: left; font-size: 13px; white-space: nowrap; cursor: pointer; user-select: none; transition: background 0.3s; }
        th:hover { background-color: #004494; } 
        td { border: 1px solid var(--border-color); padding: 10px 12px; text-align: left; font-size: 13px; vertical-align: middle; white-space: normal; word-wrap: break-word; max-width: 350px; line-height: 1.4; }
        tr:hover { filter: brightness(0.95); }
        
        .alerta-pago { color: #dc3545; font-size: 11px; font-weight: bold; display: block; margin-top: 4px; }
        .badge-duplicado { background-color: #ffc107; color: #000; padding: 3px 6px; border-radius: 4px; font-size: 10px; margin-left: 8px; font-weight: bold; display: inline-block; vertical-align: middle; }
        .alerta-consultor { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; font-size: 11px; font-weight: bold; display: block; margin-top: 6px; padding: 4px 6px; border-radius: 4px; }
        .alerta-ya-pago { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; font-size: 11px; font-weight: bold; display: block; margin-top: 6px; padding: 4px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span id="titulo-seccion">Portal de Gestión de Asesores</span>
        <button id="btn-volver" class="btn-volver" onclick="volverAInicio()">Volver a Asesores</button>
    </h2>

    <div id="vista-asesores">
        <div id="mensaje-carga" class="mensaje-carga">Conectando con Supabase... Descargando base de datos. Puede tardar unos segundos.</div>
        <div id="grid-asesores" class="grid-asesores"></div>
    </div>

    <div id="vista-dashboard">
        <div class="dashboard-wrapper">
            <div class="card-recaudo">
                <h3>Total Recaudado</h3>
                <p id="totalRecaudo">S/ 0.00</p>
            </div>

            <div class="filtros-wrapper">
                <label>Buscar:</label>
                <input type="text" id="filtroDNI" placeholder="Buscar por DNI...">
                
                <label>Filtros:</label>
                <select id="filtroFecha"><option value="">Todas las Fechas</option></select>
                <select id="filtroTipificacion"><option value="">Todas las Tipificaciones</option></select>
                
                <div class="multi-select" id="multiSelectTramo">
                    <div class="select-box" id="selectBoxTramo" onclick="toggleTramo(event)">Tramos: Todos <span>▼</span></div>
                    <div class="options-container" id="opcionesTramo"></div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th onclick="ordenarAsesor('dni_cliente')">DNI Cliente <span id="sort_dni_cliente"></span></th>
                        <th onclick="ordenarAsesor('monto_pagado')">Monto Pagado <span id="sort_monto_pagado"></span></th>
                        <th onclick="ordenarAsesor('tipificacion')">Tipificación <span id="sort_tipificacion"></span></th>
                        <th onclick="ordenarAsesor('observacion')">Observación <span id="sort_observacion"></span></th>
                        <th onclick="ordenarAsesor('fecha_ingreso')">Fecha Ingreso <span id="sort_fecha_ingreso"></span></th>
                        <th onclick="ordenarAsesor('fecha_pago')">Fecha Pago <span id="sort_fecha_pago"></span></th>
                        <th onclick="ordenarAsesor('medio_pago')">Medio de Pago <span id="sort_medio_pago"></span></th>
                        <th onclick="ordenarAsesor('tramo')">Tramo <span id="sort_tramo"></span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://kovjtcolyiuuxbeqzdql.supabase.co/rest/v1/cruce_pagos";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtvdmp0Y29seWl1dXhiZXF6ZHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzQ2OTEsImV4cCI6MjEwMTUxMDY5MX0.mRVNoVM3XUFSvFQ1rk67YF_St13TTESqC4N09OAQYL4";

    let dbData = []; 
    let datosAsesorActual = []; 
    let datosFiltradosActuales = []; 

    let columnaOrdenIndex = "";
    let ordenAscendenteIndex = true;

    document.getElementById('filtroDNI').addEventListener('input', aplicarFiltrosAsesor, false);
    document.getElementById('filtroFecha').addEventListener('change', aplicarFiltrosAsesor, false);
    document.getElementById('filtroTipificacion').addEventListener('change', aplicarFiltrosAsesor, false);

    document.addEventListener('DOMContentLoaded', cargarDatosSupabase);

    function toggleTramo(e) {
        const container = document.getElementById('opcionesTramo');
        container.style.display = container.style.display === 'block' ? 'none' : 'block';
        if(e) e.stopPropagation();
    }
    document.addEventListener('click', function(e) {
        const ms = document.getElementById('multiSelectTramo');
        if (ms && !ms.contains(e.target)) {
            const tramoCont = document.getElementById('opcionesTramo');
            if(tramoCont) tramoCont.style.display = 'none';
        }
    });

    function formatearFecha(val) {
        if (!val && val !== 0) return "";
        let str = String(val).trim();
        if (str.match(/^\d{4}-\d{2}-\d{2}$/)) return str; 
        let parts = str.split(/[\/\-]/);
        if (parts.length === 3) {
            if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
            if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
        }
        return str; 
    }

    async function cargarDatosSupabase() {
        const mensajeCarga = document.getElementById('mensaje-carga');
        const gridAsesores = document.getElementById('grid-asesores');

        try {
            let dataCruda = [];
            let offset = 0;
            const limit = 1000;
            let fetchMore = true;

            while (fetchMore) {
                const response = await fetch(`${SUPABASE_URL}?select=*&offset=${offset}&limit=${limit}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error('Error de conexión con la base de datos');
                
                let chunk = await response.json();
                dataCruda = dataCruda.concat(chunk);

                if (chunk.length < limit) {
                    fetchMore = false; 
                } else {
                    offset += limit;
                }
            }

            if (dataCruda.length === 0) {
                mensajeCarga.textContent = "No hay registros disponibles en la base de datos actualmente.";
                return;
            }

            const clientesQuePagaron = new Set();
            dataCruda.forEach(item => {
                let tip = String(item.tipificacion || "").toUpperCase();
                if (tip.includes("YA PAGO") || tip.includes("PAGO REGISTRADO")) {
                    clientesQuePagaron.add(String(item.dni_cliente).trim());
                }
            });

            dbData = dataCruda.map(item => {
                const dni = String(item.dni_cliente || "").trim();
                let yaPagoGlobal = clientesQuePagaron.has(dni);

                // Mapeo adaptado al nuevo esquema de la base de datos
                return {
                    asesor: item.asesor,
                    dni_cliente: item.dni_cliente,
                    monto_pagado: item.valor_pagamento, 
                    tipificacion: item.tipificacion,
                    observacion: item.observacion,
                    fecha_ingreso: formatearFecha(item.fecha_ingreso),
                    fecha_pago: formatearFecha(item.fecha_pago),
                    medio_pago: item.entidad,
                    tramo: item.tramo,
                    es_duplicado: item.es_duplicado === true || item.es_duplicado === 'true',
                    cliente_ya_pago: yaPagoGlobal
                };
            });

            dbData.sort((a, b) => String(a.dni_cliente).localeCompare(String(b.dni_cliente)));

            const asesoresUnicos = [...new Set(dbData.map(item => item.asesor))].filter(Boolean).sort();

            if(asesoresUnicos.length === 0) {
                mensajeCarga.textContent = "La base de datos tiene registros, pero sin asesores asignados.";
                return;
            }

            mensajeCarga.style.display = 'none'; 
            gridAsesores.innerHTML = '';
            
            asesoresUnicos.forEach(asesor => {
                const card = document.createElement('div');
                card.className = 'tarjeta-asesor';
                card.innerHTML = `
                    <div class="icono-usuario">👤</div>
                    <h3>${asesor}</h3>
                `;
                card.onclick = () => abrirPanelAsesor(asesor);
                gridAsesores.appendChild(card);
            });

        } catch (error) {
            console.error("Error:", error);
            mensajeCarga.textContent = "Error al intentar conectar con la base de datos. Verifica tu conexión.";
            mensajeCarga.style.color = "red";
        }
    }

    function abrirPanelAsesor(nombreAsesor) {
        document.getElementById('vista-asesores').style.display = 'none';
        document.getElementById('vista-dashboard').style.display = 'block';
        document.getElementById('btn-volver').style.display = 'inline-block';
        document.getElementById('titulo-seccion').textContent = `Gestión de: ${nombreAsesor}`;

        datosAsesorActual = dbData.filter(item => item.asesor === nombreAsesor);
        datosFiltradosActuales = [...datosAsesorActual]; 
        
        generarFiltros(datosAsesorActual);
        
        if (columnaOrdenIndex) {
            ordenarArrayIndex(datosFiltradosActuales, columnaOrdenIndex, ordenAscendenteIndex);
        }
        
        renderizarTablaYRecaudo(datosFiltradosActuales);
    }

    function generarFiltros(datos) {
        const fechas = new Set(), tipificaciones = new Set(), tramos = new Set();
        datos.forEach(item => {
            if (item.fecha_pago) fechas.add(item.fecha_pago);
            if (item.tipificacion) tipificaciones.add(item.tipificacion);
            if (item.tramo) tramos.add(item.tramo);
        });
        
        llenarSelect('filtroFecha', fechas, 'Todas las Fechas');
        llenarSelect('filtroTipificacion', tipificaciones, 'Todas las Tipificaciones');
        
        const contenedorTramos = document.getElementById('opcionesTramo');
        contenedorTramos.innerHTML = '';
        Array.from(tramos).sort().forEach(tramo => {
            const lbl = document.createElement('label');
            lbl.className = 'option-label';
            lbl.innerHTML = `<input type="checkbox" value="${tramo}" onchange="aplicarFiltrosAsesor()"> ${tramo}`;
            contenedorTramos.appendChild(lbl);
        });
        document.getElementById('selectBoxTramo').innerHTML = `Tramos: Todos <span>▼</span>`;
    }

    function llenarSelect(idElemento, setValores, textoDefault) {
        const select = document.getElementById(idElemento);
        select.innerHTML = `<option value="">${textoDefault}</option>`;
        Array.from(setValores).sort().forEach(valor => {
            const option = document.createElement('option');
            option.value = valor; option.textContent = valor; select.appendChild(option);
        });
    }

    function aplicarFiltrosAsesor() {
        const valDNI = document.getElementById('filtroDNI').value.trim().toLowerCase();
        const valFecha = document.getElementById('filtroFecha').value;
        const valTipificacion = document.getElementById('filtroTipificacion').value;

        const tramosSeleccionados = Array.from(document.querySelectorAll('#opcionesTramo input[type="checkbox"]:checked')).map(cb => cb.value);
        const boxTramo = document.getElementById('selectBoxTramo');
        if (tramosSeleccionados.length === 0) {
            boxTramo.innerHTML = `Tramos: Todos <span>▼</span>`;
        } else {
            boxTramo.innerHTML = `Tramos: ${tramosSeleccionados.length} selec. <span>▼</span>`;
        }

        datosFiltradosActuales = datosAsesorActual.filter(item => {
            const matchDNI = valDNI === "" || String(item.dni_cliente).toLowerCase().includes(valDNI);
            const matchFecha = valFecha === "" || item.fecha_pago === valFecha;
            const matchTip = valTipificacion === "" || item.tipificacion === valTipificacion;
            const matchTramo = tramosSeleccionados.length === 0 || tramosSeleccionados.includes(item.tramo);
            
            return matchDNI && matchFecha && matchTip && matchTramo;
        });

        if (columnaOrdenIndex) {
            ordenarArrayIndex(datosFiltradosActuales, columnaOrdenIndex, ordenAscendenteIndex);
        }

        renderizarTablaYRecaudo(datosFiltradosActuales);
    }

    function ordenarAsesor(columna) {
        if (columnaOrdenIndex === columna) {
            ordenAscendenteIndex = !ordenAscendenteIndex;
        } else {
            columnaOrdenIndex = columna;
            ordenAscendenteIndex = true;
        }

        const columnas = ['dni_cliente', 'monto_pagado', 'tipificacion', 'observacion', 'fecha_ingreso', 'fecha_pago', 'medio_pago', 'tramo'];
        columnas.forEach(col => {
            let span = document.getElementById('sort_' + col);
            if (span) span.textContent = "";
        });
        
        document.getElementById('sort_' + columna).textContent = ordenAscendenteIndex ? " ▲" : " ▼";

        ordenarArrayIndex(datosFiltradosActuales, columnaOrdenIndex, ordenAscendenteIndex);
        renderizarTablaYRecaudo(datosFiltradosActuales);
    }

    function ordenarArrayIndex(array, col, asc) {
        array.sort((a, b) => {
            let valA = a[col] !== undefined && a[col] !== null ? a[col] : "";
            let valB = b[col] !== undefined && b[col] !== null ? b[col] : "";

            if (col === 'monto_pagado') {
                valA = parseFloat(valA) || 0;
                valB = parseFloat(valB) || 0;
                return asc ? valA - valB : valB - valA;
            }

            valA = String(valA).toLowerCase();
            valB = String(valB).toLowerCase();

            if (valA < valB) return asc ? -1 : 1;
            if (valA > valB) return asc ? 1 : -1;
            return 0;
        });
    }

    function renderizarTablaYRecaudo(datos) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        let total = 0;
        const fragment = document.createDocumentFragment();
        
        let currentDNI = null;
        let colorToggle = false;
        const pagosSumados = new Set();

        const displayLimit = datos.length; 

        for (let i = 0; i < displayLimit; i++) {
            const item = datos[i];
            const monto = parseFloat(item.monto_pagado) || 0;
            
            if (!item.es_duplicado) {
                const dedupeKey = `${item.dni_cliente}_${monto.toFixed(2)}`;
                if (!pagosSumados.has(dedupeKey)) {
                    pagosSumados.add(dedupeKey);
                    total += monto;
                }
            }

            const tr = document.createElement('tr');
            
            if (item.dni_cliente !== currentDNI) {
                currentDNI = item.dni_cliente;
                colorToggle = !colorToggle;
                tr.style.borderTop = "3px solid var(--primary-color)"; 
            }
            tr.style.backgroundColor = colorToggle ? "#ffffff" : "#f0f7ff";

            let marcaRoja = "";
            let fIngreso = item.fecha_ingreso || "";
            let fPago = item.fecha_pago || "";

            if (fIngreso && fPago && fIngreso > fPago) {
                marcaRoja = `<span class="alerta-pago">Pago después de registro</span>`;
            }
            
            let badgeDuplicado = item.es_duplicado ? `<span class="badge-duplicado">DUPLICADO</span>` : "";
            
            let obsText = item.observacion || "";
            let alertaEtiqueta = "";

            if (String(obsText).toLowerCase().includes("consultor")) {
                if (item.cliente_ya_pago) {
                    alertaEtiqueta = `<span class="alerta-ya-pago">Pago ya registrado</span>`;
                } else {
                    alertaEtiqueta = `<span class="alerta-consultor">Puede registrar el pago si está en fechas correctas, pero que valide en geincos.</span>`;
                }
            }

            tr.innerHTML = `
                <td>${item.dni_cliente || ''}</td>
                <td>${monto > 0 ? monto.toFixed(2) : '0.00'} ${badgeDuplicado}</td>
                <td>${item.tipificacion || ''}</td>
                <td>${obsText} ${alertaEtiqueta}</td>
                <td>${fIngreso}</td>
                <td>${fPago} ${marcaRoja}</td>
                <td>${item.medio_pago || ''}</td>
                <td>${item.tramo || ''}</td>
            `;
            fragment.appendChild(tr);
        }

        tableBody.appendChild(fragment);
        document.getElementById('totalRecaudo').textContent = 'S/ ' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function volverAInicio() {
        document.getElementById('vista-dashboard').style.display = 'none';
        document.getElementById('vista-asesores').style.display = 'block';
        document.getElementById('btn-volver').style.display = 'none';
        document.getElementById('titulo-seccion').textContent = 'Portal de Gestión de Asesores';
        
        document.getElementById('filtroDNI').value = "";
        document.getElementById('filtroFecha').value = "";
        document.getElementById('filtroTipificacion').value = "";
        
        const checkboxes = document.querySelectorAll('#opcionesTramo input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = false);
        document.getElementById('selectBoxTramo').innerHTML = `Tramos: Todos <span>▼</span>`;
    }
</script>

</body>
</html>
