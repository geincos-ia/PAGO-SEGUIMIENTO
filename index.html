<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Asesores - Cartera y Pagos</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --border-color: #ddd;
            --btn-hover: #004494;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 98%;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 80vh;
        }
        h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-volver {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            display: none;
        }
        .btn-volver:hover {
            background-color: #5a6268;
        }

        /* Vista 1: Tarjetas Flotantes de Asesores */
        #vista-asesores {
            padding: 20px 0;
        }
        .mensaje-carga {
            text-align: center;
            font-size: 18px;
            color: #555;
            font-weight: bold;
            margin-top: 40px;
        }
        .grid-asesores {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .tarjeta-asesor {
            background: linear-gradient(135deg, #ffffff, #fdfdfd);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            padding: 25px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .tarjeta-asesor:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0,86,179,0.15);
            border-color: var(--primary-color);
        }
        .tarjeta-asesor h3 {
            margin: 0;
            font-size: 16px;
            color: #333;
            text-transform: uppercase;
        }
        .icono-usuario {
            font-size: 40px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        /* Vista 2: Dashboard y Tabla del Asesor */
        #vista-dashboard {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .dashboard-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            margin-top: 15px;
            align-items: flex-start;
        }
        
        .card-recaudo {
            background: linear-gradient(135deg, #0056b3, #004494);
            color: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 250px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-recaudo h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e0e0e0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .card-recaudo p {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        /* Estilos para los filtros */
        .filtros-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            align-items: center;
            border: 1px solid var(--border-color);
            flex: 1; /* Para que ocupe el resto del espacio junto a la caja de recaudo */
        }
        .filtros-wrapper label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .filtros-wrapper select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #fff;
            min-width: 150px;
        }

        /* Estilos de Tabla */
        .table-container {
            overflow-x: auto;
            max-height: 500px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
        }
        th {
            background-color: var(--primary-color);
            color: white;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span id="titulo-seccion">Portal de Gestión de Asesores</span>
        <button id="btn-volver" class="btn-volver" onclick="volverAInicio()">Volver a Asesores</button>
    </h2>

    <!-- Vista 1: Selector de Asesores -->
    <div id="vista-asesores">
        <div id="mensaje-carga" class="mensaje-carga">Conectando con Supabase... Cargando asesores.</div>
        <div id="grid-asesores" class="grid-asesores">
            <!-- Las tarjetas flotantes se generarán aquí mediante JS -->
        </div>
    </div>

    <!-- Vista 2: Datos del Asesor Seleccionado -->
    <div id="vista-dashboard">
        <div class="dashboard-wrapper">
            <div class="card-recaudo">
                <h3>Total Recaudado</h3>
                <p id="totalRecaudo">S/ 0.00</p>
            </div>

            <!-- Filtros para el Asesor -->
            <div class="filtros-wrapper">
                <label>Filtros:</label>
                <select id="filtroFecha">
                    <option value="">Todas las Fechas</option>
                </select>
                <select id="filtroTipificacion">
                    <option value="">Todas las Tipificaciones</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>DNI Cliente</th>
                        <th>Monto Pagado</th>
                        <th>Tipificación</th>
                        <th>Observación</th>
                        <th>Fecha Pago</th>
                        <th>Tramo</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Los pagos del asesor se insertarán aquí -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Credenciales Supabase consolidadas
    const SUPABASE_URL = "https://kovjtcolyiuuxbeqzdql.supabase.co/rest/v1/cruce_pagos";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtvdmp0Y29seWl1dXhiZXF6ZHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzQ2OTEsImV4cCI6MjEwMTUxMDY5MX0.mRVNoVM3XUFSvFQ1rk67YF_St13TTESqC4N09OAQYL4";

    let dbData = []; // Almacena toda la base de datos descargada
    let datosAsesorActual = []; // Almacena solo los datos del asesor seleccionado

    // Asignar eventos a los filtros
    document.getElementById('filtroFecha').addEventListener('change', aplicarFiltrosAsesor, false);
    document.getElementById('filtroTipificacion').addEventListener('change', aplicarFiltrosAsesor, false);

    // Iniciar carga al abrir la página
    document.addEventListener('DOMContentLoaded', cargarDatosSupabase);

    async function cargarDatosSupabase() {
        const mensajeCarga = document.getElementById('mensaje-carga');
        const gridAsesores = document.getElementById('grid-asesores');

        try {
            const response = await fetch(`${SUPABASE_URL}?select=*`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });

            if (!response.ok) {
                throw new Error('Error de conexión con la base de datos');
            }

            dbData = await response.json();

            if (dbData.length === 0) {
                mensajeCarga.textContent = "No hay registros disponibles en la base de datos actualmente.";
                return;
            }

            // Extraer lista única de asesores
            const asesoresUnicos = [...new Set(dbData.map(item => item.asesor))].filter(Boolean).sort();

            if(asesoresUnicos.length === 0) {
                mensajeCarga.textContent = "La base de datos tiene registros, pero sin asesores asignados.";
                return;
            }

            mensajeCarga.style.display = 'none'; // Ocultar mensaje de carga

            // Generar tarjetas flotantes dinámicas
            gridAsesores.innerHTML = '';
            asesoresUnicos.forEach(asesor => {
                const card = document.createElement('div');
                card.className = 'tarjeta-asesor';
                card.innerHTML = `
                    <div class="icono-usuario">👤</div>
                    <h3>${asesor}</h3>
                `;
                // Al hacer clic, se abre el panel del asesor
                card.onclick = () => abrirPanelAsesor(asesor);
                gridAsesores.appendChild(card);
            });

        } catch (error) {
            console.error("Error:", error);
            mensajeCarga.textContent = "Error al intentar conectar con la base de datos. Verifica tu conexión.";
            mensajeCarga.style.color = "red";
        }
    }

    function abrirPanelAsesor(nombreAsesor) {
        // Transición de vistas
        document.getElementById('vista-asesores').style.display = 'none';
        document.getElementById('vista-dashboard').style.display = 'block';
        document.getElementById('btn-volver').style.display = 'inline-block';
        document.getElementById('titulo-seccion').textContent = `Gestión de: ${nombreAsesor}`;

        // Filtrar datos solo del asesor seleccionado y guardarlos en la variable global del perfil
        datosAsesorActual = dbData.filter(item => item.asesor === nombreAsesor);

        // Generar opciones de los filtros basadas solo en los datos de este asesor
        generarFiltros(datosAsesorActual);

        // Renderizar la tabla y el recaudo inicial (sin filtros aplicados)
        renderizarTablaYRecaudo(datosAsesorActual);
    }

    function generarFiltros(datos) {
        const fechas = new Set();
        const tipificaciones = new Set();

        datos.forEach(item => {
            if (item.fecha_pago) fechas.add(item.fecha_pago);
            if (item.tipificacion) tipificaciones.add(item.tipificacion);
        });

        llenarSelect('filtroFecha', fechas, 'Todas las Fechas');
        llenarSelect('filtroTipificacion', tipificaciones, 'Todas las Tipificaciones');
    }

    function llenarSelect(idElemento, setValores, textoDefault) {
        const select = document.getElementById(idElemento);
        select.innerHTML = `<option value="">${textoDefault}</option>`;
        
        Array.from(setValores).sort().forEach(valor => {
            const option = document.createElement('option');
            option.value = valor;
            option.textContent = valor;
            select.appendChild(option);
        });
    }

    function aplicarFiltrosAsesor() {
        const valFecha = document.getElementById('filtroFecha').value;
        const valTipificacion = document.getElementById('filtroTipificacion').value;

        // Filtrar sobre los datos ya separados para este asesor
        const datosFiltrados = datosAsesorActual.filter(item => {
            const coincideFecha = valFecha === "" || item.fecha_pago === valFecha;
            const coincideTipificacion = valTipificacion === "" || item.tipificacion === valTipificacion;
            
            return coincideFecha && coincideTipificacion;
        });

        // Actualizar vista con la info filtrada
        renderizarTablaYRecaudo(datosFiltrados);
    }

    function renderizarTablaYRecaudo(datos) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        let total = 0;

        const fragment = document.createDocumentFragment();
        
        datos.forEach(item => {
            const monto = parseFloat(item.monto_pagado) || 0;
            total += monto;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.dni_cliente || ''}</td>
                <td>${monto > 0 ? monto.toFixed(2) : '0.00'}</td>
                <td>${item.tipificacion || ''}</td>
                <td>${item.observacion || ''}</td>
                <td>${item.fecha_pago || ''}</td>
                <td>${item.tramo || ''}</td>
            `;
            fragment.appendChild(tr);
        });

        tableBody.appendChild(fragment);

        document.getElementById('totalRecaudo').textContent = 'S/ ' + total.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function volverAInicio() {
        document.getElementById('vista-dashboard').style.display = 'none';
        document.getElementById('vista-asesores').style.display = 'block';
        document.getElementById('btn-volver').style.display = 'none';
        document.getElementById('titulo-seccion').textContent = 'Portal de Gestión de Asesores';
        
        // Limpiar selecciones de filtro al volver
        document.getElementById('filtroFecha').value = "";
        document.getElementById('filtroTipificacion').value = "";
    }
</script>

</body>
</html>
